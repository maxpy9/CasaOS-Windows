<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 612" width="1280" height="612" role="img"><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#101d33"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5ee3ff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb0c6"/></marker></defs><rect width="1280" height="612" rx="20" fill="url(#bg)"/><text x="640" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f6fb" text-anchor="middle">What had to be replaced</text><text x="60" y="106" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ef5a5f" text-anchor="start">On Linux</text><text x="520" y="106" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="start">On Windows</text><rect x="60" y="122" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="156" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">systemd</text><line x1="464" y1="149" x2="514" y2="149" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="122" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="156" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">CasaOS.exe supervisor + process snapshot</text><rect x="60" y="188" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">lsblk</text><line x1="464" y1="215" x2="514" y2="215" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="188" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">DeviceIoControl, same JSON output</text><rect x="60" y="254" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="288" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">/proc/net</text><line x1="464" y1="281" x2="514" y2="281" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="254" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="288" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">IP Helper API (TCP and UDP tables)</text><rect x="60" y="320" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="354" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">bash network scripts</text><line x1="464" y1="347" x2="514" y2="347" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="320" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="354" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">gopsutil, virtual adapters filtered out</text><rect x="60" y="386" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="420" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">/etc/localtime</text><line x1="464" y1="413" x2="514" y2="413" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="386" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="420" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Windows Registry, converted to IANA</text><rect x="60" y="452" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="486" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Unix socket of the message bus</text><line x1="464" y1="479" x2="514" y2="479" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="452" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="486" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">TCP port</text><rect x="60" y="518" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="552" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">/DATA volumes of the apps</text><line x1="464" y1="545" x2="514" y2="545" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="518" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="552" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Windows paths, shared by Docker Desktop</text></svg>