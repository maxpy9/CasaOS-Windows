<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 492" width="1280" height="492" role="img"><style>@keyframes flow{to{stroke-dashoffset:-28}}.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#101d33"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5ee3ff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb0c6"/></marker></defs><rect width="1280" height="492" rx="20" fill="url(#bg)"/><text x="640" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f6fb" text-anchor="middle">CasaOS still thinks it is on Linux</text><text x="640" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="400" fill="#9fb0c6" text-anchor="middle">The dashboard and the APIs keep their Linux paths. A small package, vfs, translates them on the fly.</text><text x="60" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#5ee3ff" text-anchor="start">What CasaOS asks for</text><text x="560" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="start">What Windows opens</text><rect x="60" y="164" width="370" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="82" y="201" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">/DATA/Documents</text><path class="flow" d="M430 193H560" stroke="#9fb0c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="462" y="177" width="66" height="32" rx="16" fill="#14263f" stroke="#3b82f6" stroke-width="1.5" /><text x="495" y="199" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="700" fill="#f2f6fb" text-anchor="middle">vfs</text><rect x="560" y="164" width="660" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="582" y="201" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">%USERPROFILE%\CasaOS\Documents</text><rect x="60" y="238" width="370" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="82" y="275" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">/media/C/Users</text><path class="flow" d="M430 267H560" stroke="#9fb0c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="462" y="251" width="66" height="32" rx="16" fill="#14263f" stroke="#3b82f6" stroke-width="1.5" /><text x="495" y="273" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="700" fill="#f2f6fb" text-anchor="middle">vfs</text><rect x="560" y="238" width="660" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="582" y="275" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">C:\Users</text><rect x="60" y="312" width="370" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="82" y="349" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">/media/D/Movies</text><path class="flow" d="M430 341H560" stroke="#9fb0c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="462" y="325" width="66" height="32" rx="16" fill="#14263f" stroke="#3b82f6" stroke-width="1.5" /><text x="495" y="347" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="700" fill="#f2f6fb" text-anchor="middle">vfs</text><rect x="560" y="312" width="660" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="582" y="349" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">D:\Movies</text><rect x="60" y="386" width="370" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="82" y="423" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">/var/lib/casaos</text><path class="flow" d="M430 415H560" stroke="#9fb0c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="462" y="399" width="66" height="32" rx="16" fill="#14263f" stroke="#3b82f6" stroke-width="1.5" /><text x="495" y="421" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="700" fill="#f2f6fb" text-anchor="middle">vfs</text><rect x="560" y="386" width="660" height="58" rx="14" fill="#16202f" stroke="#2d3d55" stroke-width="1.5" /><text x="582" y="423" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" fill="#f2f6fb" text-anchor="start">%LOCALAPPDATA%\CasaOS\root\var\lib\casaos</text></svg>