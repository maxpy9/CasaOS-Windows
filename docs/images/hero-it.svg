<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img"><style>@keyframes pulse{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.55;transform:scale(1.08)}}.glow{transform-origin:1040px 205px;animation:pulse 4s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:0}}.ring{stroke-dasharray:540;stroke-dashoffset:540;animation:dash 2.4s ease-out forwards}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#101d33"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5ee3ff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb0c6"/></marker></defs><rect width="1280" height="420" rx="20" fill="url(#bg)"/><defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter></defs><circle class="glow" cx="1040" cy="205" r="150" fill="#5ee3ff" opacity=".25" filter="url(#blur)"/><circle cx="1040" cy="205" r="86" fill="#16202f" stroke="#2d3d55" stroke-width="2"/><circle class="ring" cx="1040" cy="205" r="86" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 1040 205)"/><path d="M1013 181a38 38 0 1 0 54 0" fill="none" stroke="#5ee3ff" stroke-width="9" stroke-linecap="round"/><line x1="1040" y1="161" x2="1040" y2="202" stroke="#5ee3ff" stroke-width="9" stroke-linecap="round"/><rect x="70" y="74" width="233.2" height="34" rx="17" fill="#3a2a0f" stroke="#f5b342" stroke-width="1.5" /><text x="186.6" y="97" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#f5b342" text-anchor="middle">PORTING NON UFFICIALE</text><text x="70" y="182" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f2f6fb" text-anchor="start">CasaOS per Windows</text><text x="70" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0c6" text-anchor="start">Il tuo cloud personale sul tuo PC. Acceso quando</text><text x="70" y="260" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0c6" text-anchor="start">premi il pulsante, spento quando non serve.</text><rect x="70" y="320" width="196.7" height="42" rx="21" fill="#1d2a3d" stroke="#2d3d55" stroke-width="1.5" /><circle cx="90" cy="341" r="5" fill="#34d399"/><text x="103" y="347" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Installer normale</text><rect x="278.7" y="320" width="151.2" height="42" rx="21" fill="#1d2a3d" stroke="#2d3d55" stroke-width="1.5" /><circle cx="298.7" cy="341" r="5" fill="#5ee3ff"/><text x="311.7" y="347" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Niente admin</text><rect x="441.9" y="320" width="224.0" height="42" rx="21" fill="#1d2a3d" stroke="#2d3d55" stroke-width="1.5" /><circle cx="461.9" cy="341" r="5" fill="#a78bfa"/><text x="474.9" y="347" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Niente in background</text></svg>