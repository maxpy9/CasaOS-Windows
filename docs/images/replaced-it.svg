 x1="464" y1="347" x2="514" y2="347" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="320" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="354" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">gopsutil, schede virtuali filtrate</text><rect x="60" y="386" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="420" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">/etc/localtime</text><line x1="464" y1="413" x2="514" y2="413" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="386" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="420" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Registro di Windows, convertito in IANA</text><rect x="60" y="452" width="400" height="54" rx="14" fill="#2a1a22" stroke="#5b2d3a" stroke-width="1.5" /><text x="80" y="486" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">socket Unix del message bus</text><line x1="464" y1="479" x2="514" y2="479" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="452" width="700" height="54" rx="14" fill="#10291f" stroke="#1f5a43" stroke-width="1.5" /><text x="540" y="486" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500" fill="#f2f6fb" text-anchor="start">Porta TCP</text><rect x="60" y="518" widt